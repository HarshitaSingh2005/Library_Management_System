name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Backend
      - name: Setup Node (backend)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install backend deps
        run: |
          cd backend
          npm install

      # Frontend
      - name: Setup Node (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend deps & build
        run: |
          cd frontend
          npm install
          npm run build